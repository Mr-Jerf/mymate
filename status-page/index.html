<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div class="brand-mark" aria-hidden="true">●</div>
      <div><h1 id="brand">Network Status</h1><p id="subtitle">Live service health</p></div>
      <button id="subscribe-open" class="subscribe-open" type="button" hidden>Subscribe</button><span id="last-checked" class="last">Checking…</span>
    </header>
    <section id="overall" class="overall loading"><span class="pulse"></span><div><strong>Loading status…</strong><small>Connecting to monitoring service</small></div></section>
    <div class="section-title"><h2>Service by site</h2><span>60-day availability</span></div>
    <section id="sites" class="states" aria-live="polite"></section>
    <section id="activity" class="activity" hidden><h2 id="activity-title"></h2><div id="activity-body"></div></section>
    <section id="incidents" class="feed" hidden><h2>Current status updates</h2><div id="incident-list"></div></section>
    <section id="maintenance" class="maintenance" hidden><h2>Maintenance</h2><div id="maintenance-list"></div></section>
    <p id="error" class="error" hidden></p>
    <div id="subscribe-modal" class="subscribe-modal" hidden><div class="subscribe-dialog" role="dialog" aria-modal="true" aria-labelledby="subscribe-title"><button id="subscribe-close" class="subscribe-close" type="button" aria-label="Close">×</button><h2 id="subscribe-title">Subscribe to site updates</h2><p>Choose one site and the updates you want to receive.</p><form id="subscribe-form"><label>Email address<input id="subscribe-email" type="email" name="email" required autocomplete="email"></label><label>Site<select id="subscribe-site" name="site_key" required></select></label><div class="subscribe-options"><label><input type="checkbox" name="outage" checked> Outages</label><label><input type="checkbox" name="degraded" checked> Degraded</label><label><input type="checkbox" name="updates" checked> Updates</label><label><input type="checkbox" name="resolved" checked> Restored</label><label><input type="checkbox" name="maintenance" checked> Maintenance</label></div><button class="subscribe-submit" type="submit">Send confirmation email</button><small id="subscribe-message" class="subscribe-message" role="status"></small></form></div></div>
    <footer><span id="footer-brand">Network Operations</span><span>Updates automatically</span></footer>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
